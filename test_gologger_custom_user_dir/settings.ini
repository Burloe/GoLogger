[plugin]

base_directory="user://GoLogger/"
categories=[["game", 0, "null", "null", 0, 0, true], ["error", 1, "null", "null", 0, 0, true]]

[settings]

log_header=0
canvaslayer_layer=5
autostart_session=true
timestamp_entries=true
use_utc=false
dash_separator=false
limit_method=0
entry_count_action=0
session_timer_action=0
file_cap=10
